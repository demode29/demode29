<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four strings — WebGL</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0f14; }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #8b9aab;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute; inset: 0; pointer-events: none;
      padding: 18px 22px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .top, .bot { display: flex; justify-content: space-between; gap: 16px; }
    .top span, .bot span { font-size: 11px; letter-spacing: 0.08em; }
    .hint { opacity: 0.7; }
    #shader-error {
      position: absolute; left: 22px; right: 22px; top: 52px;
      margin: 0; color: #e8b4b4; font-size: 12px; line-height: 1.45;
      white-space: pre-wrap; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="top">
      <span>4CH · BASS</span>
      <span>WEBGL · PICK TO PLUCK</span>
    </div>
    <div class="bot">
      <span>E1 41.2 · A1 55.0 · D2 73.4 · G2 98.0</span>
      <span class="hint" id="hint">click a string</span>
    </div>
  </div>
  <pre id="shader-error"></pre>
  <script>
    const errEl = document.getElementById("shader-error");
    function fail(err) {
      const msg = err && err.message ? err.message : String(err);
      errEl.textContent = msg;
      console.error(err);
    }

    (async function start() {
    const STRINGS = [
      { name: "E1", hz: 41.20, y:  0.90, width: 0.018, color: [0.79, 0.64, 0.42] },
      { name: "A1", hz: 55.00, y:  0.30, width: 0.015, color: [0.83, 0.71, 0.51] },
      { name: "D2", hz: 73.42, y: -0.30, width: 0.012, color: [0.89, 0.79, 0.64] },
      { name: "G2", hz: 97.99, y: -0.90, width: 0.010, color: [0.95, 0.92, 0.84] },
    ];
    const X0 = -1.85, X1 = 1.85, SEGMENTS = 192;

    const canvas = document.getElementById("c");
    const gl = canvas.getContext("webgl2", { antialias: true, alpha: false });
    if (!gl) {
      document.body.textContent = "WebGL2 is required.";
      throw new Error("WebGL2");
    }

    function compile(type, src, label) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error((label || "shader") + "\n" + gl.getShaderInfoLog(s));
      }
      return s;
    }
    function program(vs, fs, vsLabel, fsLabel) {
      const p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER, vs, vsLabel));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs, fsLabel));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(p));
      }
      return p;
    }

    async function loadShader(path) {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) throw new Error("Could not load " + path);
      return res.text();
    }

    const [stringVert, stringFrag] = await Promise.all([
      loadShader("string.vert"),
      loadShader("string.frag"),
    ]);
    const stringProg = program(stringVert, stringFrag, "string.vert", "string.frag");

    const gridProg = program(`#version 300 es
      layout(location=0) in vec3 aPos;
      uniform mat4 uMVP;
      void main() { gl_Position = uMVP * vec4(aPos, 1.0); }
    `, `#version 300 es
      precision highp float;
      uniform vec3 uColor;
      out vec4 outColor;
      void main() { outColor = vec4(uColor, 1.0); }
    `);

    const rayProg = gridProg;

    function makeStringMesh() {
      const verts = [];
      for (let i = 0; i <= SEGMENTS; i++) {
        const u = i / SEGMENTS;
        const x = X0 + (X1 - X0) * u;
        verts.push(x, 0, 0, u, -1, x, 0, 0, u, 1);
      }
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 20, 12);
      gl.enableVertexAttribArray(2);
      gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 20, 16);
      gl.bindVertexArray(null);
      return { vao, count: (SEGMENTS + 1) * 2 };
    }

    function makeGrid() {
      const lines = [];
      for (let i = 0; i <= 12; i++) {
        const x = X0 + (X1 - X0) * (i / 12);
        lines.push(x, -1.35, -0.02, x, 1.35, -0.02);
      }
      for (let i = 0; i <= 8; i++) {
        const y = -1.35 + 2.7 * (i / 8);
        lines.push(X0, y, -0.02, X1, y, -0.02);
      }
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(lines), gl.STATIC_DRAW);
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      return { vao, count: lines.length / 3 };
    }

    function makeRayBuf() {
      const buf = gl.createBuffer();
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);
      return { vao, buf, count: 2 };
    }

    const stringMesh = makeStringMesh();
    const gridMesh = makeGrid();
    const rayMesh = makeRayBuf();

    const loc = {
      mvp: gl.getUniformLocation(stringProg, "uMVP"),
      amp: gl.getUniformLocation(stringProg, "uAmp"),
      pluck: gl.getUniformLocation(stringProg, "uPluck"),
      time: gl.getUniformLocation(stringProg, "uTime"),
      omega: gl.getUniformLocation(stringProg, "uOmega"),
      width: gl.getUniformLocation(stringProg, "uWidth"),
      y: gl.getUniformLocation(stringProg, "uY"),
      color: gl.getUniformLocation(stringProg, "uColor"),
      gridMvp: gl.getUniformLocation(gridProg, "uMVP"),
      gridColor: gl.getUniformLocation(gridProg, "uColor"),
    };

    function mul(a, b) {
      const o = new Float32Array(16);
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          o[i * 4 + j] =
            a[j] * b[i * 4] + a[4 + j] * b[i * 4 + 1] +
            a[8 + j] * b[i * 4 + 2] + a[12 + j] * b[i * 4 + 3];
        }
      }
      return o;
    }
    function perspective(fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2);
      const m = new Float32Array(16);
      m[0] = f / aspect; m[5] = f;
      m[10] = (far + near) / (near - far);
      m[11] = -1;
      m[14] = (2 * far * near) / (near - far);
      return m;
    }
    function lookAt(eye, center, up) {
      const zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
      let zl = 1 / Math.hypot(zx, zy, zz);
      const z0 = zx * zl, z1 = zy * zl, z2 = zz * zl;
      let x0 = up[1] * z2 - up[2] * z1;
      let x1 = up[2] * z0 - up[0] * z2;
      let x2 = up[0] * z1 - up[1] * z0;
      const xl = 1 / Math.hypot(x0, x1, x2);
      x0 *= xl; x1 *= xl; x2 *= xl;
      const y0 = z1 * x2 - z2 * x1;
      const y1 = z2 * x0 - z0 * x2;
      const y2 = z0 * x1 - z1 * x0;
      const m = new Float32Array(16);
      m[0] = x0; m[1] = y0; m[2] = z0;
      m[4] = x1; m[5] = y1; m[6] = z1;
      m[8] = x2; m[9] = y2; m[10] = z2;
      m[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
      m[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
      m[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
      m[15] = 1;
      return m;
    }
    function invert(m) {
      const a00 = m[0], a01 = m[1], a02 = m[2], a03 = m[3];
      const a10 = m[4], a11 = m[5], a12 = m[6], a13 = m[7];
      const a20 = m[8], a21 = m[9], a22 = m[10], a23 = m[11];
      const a30 = m[12], a31 = m[13], a32 = m[14], a33 = m[15];
      const b00 = a00 * a11 - a01 * a10;
      const b01 = a00 * a12 - a02 * a10;
      const b02 = a00 * a13 - a03 * a10;
      const b03 = a01 * a12 - a02 * a11;
      const b04 = a01 * a13 - a03 * a11;
      const b05 = a02 * a13 - a03 * a12;
      const b06 = a20 * a31 - a21 * a30;
      const b07 = a20 * a32 - a22 * a30;
      const b08 = a20 * a33 - a23 * a30;
      const b09 = a21 * a32 - a22 * a31;
      const b10 = a21 * a33 - a23 * a31;
      const b11 = a22 * a33 - a23 * a32;
      let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
      if (!det) return m;
      det = 1 / det;
      const o = new Float32Array(16);
      o[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;
      o[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
      o[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;
      o[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
      o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;
      o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
      o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;
      o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
      o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;
      o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
      o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
      o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
      o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
      o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
      o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
      o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
      return o;
    }
    function transform(m, v, w) {
      const x = v[0], y = v[1], z = v[2];
      const ow = m[3] * x + m[7] * y + m[11] * z + m[15] * w;
      const inv = ow ? 1 / ow : 1;
      return [
        (m[0] * x + m[4] * y + m[8] * z + m[12] * w) * inv,
        (m[1] * x + m[5] * y + m[9] * z + m[13] * w) * inv,
        (m[2] * x + m[6] * y + m[10] * z + m[14] * w) * inv,
      ];
    }

    const state = STRINGS.map(() => ({ amp: 0, pluck: 0.5, t0: 0 }));
    let ray = null;
    let mvp = new Float32Array(16);
    let invMvp = new Float32Array(16);
    let audio = null;

    function ensureAudio() {
      if (audio) return audio;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      audio = ctx;
      return ctx;
    }

    function pluckSound(hz) {
      const ctx = ensureAudio();
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const oct = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      oct.type = "sine";
      osc.frequency.value = hz;
      oct.frequency.value = hz * 2;
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(420, now);
      filter.frequency.exponentialRampToValueAtTime(120, now + 0.8);
      filter.Q.value = 0.9;
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.4);
      osc.connect(filter);
      oct.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now); oct.start(now);
      osc.stop(now + 1.5); oct.stop(now + 1.5);
    }

    function pluck(i, u, withSound) {
      state[i].amp = 0.32;
      state[i].pluck = u;
      state[i].t0 = performance.now() / 1000;
      if (withSound) {
        pluckSound(STRINGS[i].hz);
        document.getElementById("hint").textContent = STRINGS[i].name + " plucked";
      }
    }

    function distRaySegment(ro, rd, a, b) {
      const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
      const ax = [a[0] - ro[0], a[1] - ro[1], a[2] - ro[2]];
      const d1343 = ax[0] * rd[0] + ax[1] * rd[1] + ax[2] * rd[2];
      const d4321 = rd[0] * ab[0] + rd[1] * ab[1] + rd[2] * ab[2];
      const d1321 = ax[0] * ab[0] + ax[1] * ab[1] + ax[2] * ab[2];
      const d4343 = rd[0] * rd[0] + rd[1] * rd[1] + rd[2] * rd[2];
      const d2121 = ab[0] * ab[0] + ab[1] * ab[1] + ab[2] * ab[2];
      const denom = d2121 * d4343 - d4321 * d4321;
      let s = denom !== 0 ? (d1343 * d4321 - d1321 * d4343) / denom : 0;
      s = Math.min(1, Math.max(0, s));
      let t = (d1343 + s * d4321) / d4343;
      t = Math.max(0, t);
      const p = [a[0] + ab[0] * s, a[1] + ab[1] * s, a[2] + ab[2] * s];
      const q = [ro[0] + rd[0] * t, ro[1] + rd[1] * t, ro[2] + rd[2] * t];
      const d = Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
      return { d, s, p, q };
    }

    function pick(clientX, clientY, withSound) {
      const rect = canvas.getBoundingClientRect();
      const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
      const ndcY = 1 - ((clientY - rect.top) / rect.height) * 2;
      const near = transform(invMvp, [ndcX, ndcY, -1], 1);
      const far = transform(invMvp, [ndcX, ndcY, 1], 1);
      const rd = [far[0] - near[0], far[1] - near[1], far[2] - near[2]];
      const rl = Math.hypot(rd[0], rd[1], rd[2]) || 1;
      rd[0] /= rl; rd[1] /= rl; rd[2] /= rl;
      let best = null;
      STRINGS.forEach((s, i) => {
        const hit = distRaySegment(near, rd, [X0, s.y, 0], [X1, s.y, 0]);
        if (!best || hit.d < best.d) best = { i, ...hit };
      });
      ray = { a: near, b: [near[0] + rd[0] * 8, near[1] + rd[1] * 8, near[2] + rd[2] * 8], until: performance.now() + 220 };
      if (best && best.d < 0.22) pluck(best.i, best.s, withSound);
    }

    canvas.addEventListener("pointerdown", (e) => {
      pick(e.clientX, e.clientY, true);
    });

    const groove = [
      [0, 0.00], [1, 1.00], [0, 2.00], [0, 2.50], [1, 3.00],
    ];
    let grooveStart = 0;
    let grooveCycle = -1;
    const grooveFired = new Set();
    const GROOVE = 4.0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0.043, 0.059, 0.078, 1);

    function frame(nowMs) {
      const now = nowMs / 1000;
      if (!grooveStart) grooveStart = now;
      const cycle = Math.floor((now - grooveStart) / GROOVE);
      if (cycle !== grooveCycle) {
        grooveCycle = cycle;
        grooveFired.clear();
      }
      const beat = (now - grooveStart) % GROOVE;
      groove.forEach(([i, t], n) => {
        if (beat >= t && !grooveFired.has(n)) {
          grooveFired.add(n);
          pluck(i, 0.36 + Math.random() * 0.22, false);
        }
      });

      const aspect = canvas.width / canvas.height;
      const proj = perspective(0.62, aspect, 0.1, 20);
      const eye = [0.0, 1.65, 3.55];
      const view = lookAt(eye, [0, 0.05, 0], [0, 1, 0]);
      mvp = mul(proj, view);
      invMvp = invert(mvp);

      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(gridProg);
      gl.uniformMatrix4fv(loc.gridMvp, false, mvp);
      gl.uniform3f(loc.gridColor, 0.13, 0.17, 0.22);
      gl.bindVertexArray(gridMesh.vao);
      gl.drawArrays(gl.LINES, 0, gridMesh.count);

      gl.useProgram(stringProg);
      gl.uniformMatrix4fv(loc.mvp, false, mvp);
      gl.bindVertexArray(stringMesh.vao);
      STRINGS.forEach((s, i) => {
        const st = state[i];
        const age = Math.max(0, now - st.t0);
        gl.uniform1f(loc.amp, st.amp);
        gl.uniform1f(loc.pluck, st.pluck);
        gl.uniform1f(loc.time, age);
        gl.uniform1f(loc.omega, s.hz * Math.PI * 2 / 12);
        gl.uniform1f(loc.width, s.width);
        gl.uniform1f(loc.y, s.y);
        gl.uniform3fv(loc.color, s.color);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, stringMesh.count);
      });

      if (ray && performance.now() < ray.until) {
        gl.useProgram(rayProg);
        gl.uniformMatrix4fv(loc.gridMvp, false, mvp);
        gl.uniform3f(loc.gridColor, 0.75, 0.82, 0.90);
        gl.bindBuffer(gl.ARRAY_BUFFER, rayMesh.buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
          ray.a[0], ray.a[1], ray.a[2], ray.b[0], ray.b[1], ray.b[2],
        ]), gl.STREAM_DRAW);
        gl.bindVertexArray(rayMesh.vao);
        gl.drawArrays(gl.LINES, 0, 2);
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    })().catch(fail);
  </script>
</body>
</html>
